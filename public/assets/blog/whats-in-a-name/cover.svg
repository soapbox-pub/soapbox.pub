<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(139, 92, 246);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(59, 130, 246);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    What's in a Name?
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="36" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Why We Named Shakespeare, Shakespeare
  </text>
  
  <!-- Quote -->
  <text x="600" y="420" font-family="Georgia, serif" font-size="28" font-style="italic" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    "From infinite monkeys to infinite apps"
  </text>
  
  <!-- Footer -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)" text-anchor="middle">
    Soapbox Blog
  </text>
</svg>
