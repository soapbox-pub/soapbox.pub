<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc" rx="12"/>
  <rect x="1" y="1" width="598" height="398" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="60" fill="#8B5CF6" rx="12"/>
  <rect x="0" y="48" width="600" height="12" fill="#8B5CF6"/>
  
  <!-- AI Assistant info -->
  <circle cx="30" cy="30" r="15" fill="rgba(255,255,255,0.2)"/>
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">🤖</text>
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">Shakespeare AI</text>
  <text x="55" y="40" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Building your website...</text>
  
  <!-- Chat messages -->
  <!-- User message -->
  <rect x="80" y="80" width="480" height="60" fill="#3B82F6" rx="12"/>
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">You</text>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Build me a modern portfolio website for a web developer</text>
  <text x="100" y="128" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">with dark theme and blue accents</text>
  
  <!-- AI response -->
  <rect x="40" y="160" width="520" height="80" fill="white" rx="12" stroke="#e2e8f0"/>
  <circle cx="60" cy="180" r="10" fill="#8B5CF6"/>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">🎭</text>
  <text x="80" y="180" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Shakespeare AI</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Perfect! I'll create a sleek portfolio site for you. Starting with a dark</text>
  <text x="80" y="208" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">theme and blue accents. Let me build the header, hero section, and</text>
  <text x="80" y="221" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">project showcase...</text>
  
  <!-- Typing indicator -->
  <rect x="40" y="260" width="200" height="40" fill="white" rx="12" stroke="#e2e8f0"/>
  <circle cx="60" cy="280" r="10" fill="#8B5CF6"/>
  <text x="60" y="285" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">🎭</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Shakespeare AI</text>
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">is typing...</text>
  
  <!-- Dots animation -->
  <circle cx="140" cy="285" r="2" fill="#8B5CF6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="285" r="2" fill="#8B5CF6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="285" r="2" fill="#8B5CF6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Input area -->
  <rect x="20" y="340" width="560" height="40" fill="white" rx="20" stroke="#e2e8f0"/>
  <text x="40" y="365" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">Type your message...</text>
  <circle cx="560" cy="360" r="15" fill="#8B5CF6"/>
  <text x="560" y="365" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">→</text>
</svg>