<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="500" r="30" fill="rgba(255,255,255,0.15)"/>
  <circle cx="1000" cy="150" r="40" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Main content -->
  <g transform="translate(100, 150)">
    <!-- Shakespeare emoji/icon -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="120" fill="white">🎭</text>
    
    <!-- Title -->
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#text-gradient)">Shakespeare</text>
    <text x="150" y="110" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)">AI-Powered Website Builder on Nostr</text>
    
    <!-- Subtitle -->
    <text x="150" y="170" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">Build websites through conversation</text>
    <text x="150" y="210" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">Powered by MKStack • Secured by Nostr</text>
    
    <!-- Features -->
    <g transform="translate(150, 260)">
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">🤖 Natural Language AI Building</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">👀 Real-time Live Preview</text>
      <text x="0" y="90" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">🔐 Decentralized & Encrypted</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">⚡ Instant Deployment</text>
    </g>
  </g>
  
  <!-- Beta badge -->
  <g transform="translate(950, 50)">
    <rect x="0" y="0" width="200" height="60" rx="30" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">BETA LAUNCH</text>
  </g>
</svg>