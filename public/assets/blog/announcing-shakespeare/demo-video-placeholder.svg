<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#1a1a1a" rx="12"/>
  
  <!-- Video player UI -->
  <rect x="20" y="20" width="760" height="410" fill="#000" rx="8"/>
  
  <!-- Play button -->
  <circle cx="400" cy="225" r="50" fill="rgba(255,255,255,0.9)"/>
  <polygon points="380,205 380,245 420,225" fill="#1a1a1a"/>
  
  <!-- Video title overlay -->
  <rect x="40" y="350" width="720" height="60" fill="rgba(0,0,0,0.7)" rx="4"/>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="bold">
    Shakespeare Demo: Building a Website with AI
  </text>
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="14" fill="#ccc">
    Watch as Shakespeare creates a complete website through natural conversation
  </text>
  
  <!-- Progress bar -->
  <rect x="40" y="420" width="720" height="4" fill="rgba(255,255,255,0.3)" rx="2"/>
  <rect x="40" y="420" width="200" height="4" fill="#8B5CF6" rx="2"/>
</svg>