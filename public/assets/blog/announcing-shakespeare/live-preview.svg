<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#1a1a1a" rx="12"/>
  
  <!-- Browser chrome -->
  <rect x="20" y="20" width="760" height="40" fill="#2d3748" rx="8"/>
  <circle cx="40" cy="40" r="6" fill="#ef4444"/>
  <circle cx="60" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="80" cy="40" r="6" fill="#10b981"/>
  
  <!-- URL bar -->
  <rect x="120" y="30" width="500" height="20" fill="#4a5568" rx="10"/>
  <text x="130" y="42" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0">https://shakespeare-preview-abc123.vercel.app</text>
  
  <!-- Website content -->
  <rect x="20" y="60" width="760" height="420" fill="#0f172a"/>
  
  <!-- Header -->
  <rect x="20" y="60" width="760" height="80" fill="#1e293b"/>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">John Developer</text>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Full Stack Developer</text>
  
  <!-- Navigation -->
  <text x="600" y="85" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">Home</text>
  <text x="640" y="85" font-family="Arial, sans-serif" font-size="12" fill="#64748b">About</text>
  <text x="680" y="85" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Projects</text>
  <text x="730" y="85" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Contact</text>
  
  <!-- Hero section -->
  <rect x="60" y="180" width="680" height="120" fill="#1e293b" rx="8"/>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">Building Amazing Web Experiences</text>
  <text x="80" y="235" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">I create modern, responsive websites and applications</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">using the latest technologies and best practices.</text>
  
  <!-- CTA Button -->
  <rect x="80" y="270" width="120" height="35" fill="#3b82f6" rx="6"/>
  <text x="140" y="290" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">View My Work</text>
  
  <!-- Projects section -->
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Featured Projects</text>
  
  <!-- Project cards -->
  <rect x="60" y="360" width="200" height="100" fill="#1e293b" rx="6"/>
  <rect x="60" y="360" width="200" height="60" fill="#3b82f6" rx="6"/>
  <text x="70" y="420" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">E-commerce Platform</text>
  <text x="70" y="435" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">React, Node.js, MongoDB</text>
  
  <rect x="280" y="360" width="200" height="100" fill="#1e293b" rx="6"/>
  <rect x="280" y="360" width="200" height="60" fill="#10b981" rx="6"/>
  <text x="290" y="420" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Task Management App</text>
  <text x="290" y="435" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Vue.js, Express, PostgreSQL</text>
  
  <rect x="500" y="360" width="200" height="100" fill="#1e293b" rx="6"/>
  <rect x="500" y="360" width="200" height="60" fill="#f59e0b" rx="6"/>
  <text x="510" y="420" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Weather Dashboard</text>
  <text x="510" y="435" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">React, TypeScript, API</text>
  
  <!-- Live indicator -->
  <rect x="720" y="30" width="50" height="20" fill="#10b981" rx="10"/>
  <circle cx="730" cy="40" r="3" fill="white">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="740" y="42" font-family="Arial, sans-serif" font-size="8" fill="white">LIVE</text>
</svg>