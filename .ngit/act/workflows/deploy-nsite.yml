name: Deploy nsite

# Builds the prerendered marketing site and publishes it as the named nsite
# "soapbox" (NIP-5A kind 35128) described by .nsite/config.json: the files
# become Blossom blobs, the manifest mapping path -> sha256 goes to relays, and
# npanel on venus serves soapbox.pub from it. Runs on pushes to the default
# branch, alongside Test.
#
# Secrets are provisioned by the ngit-ci operator as
# NGIT_CI_SECRET_<ALIAS>__<NAME> (note the double underscore) and injected ONLY
# on maintainer-authored triggers, which a push to a watched repo always is.
# This job needs one:
#   NSYTE_BUNKER   nbunksec1... -- a pre-established NIP-46 session, the form
#                  nsyte documents for CI. THE SIGNING PUBKEY IS THE SITE
#                  ADDRESS, so this secret decides whose namespace the site
#                  lives in.
# An empty NSYTE_BUNKER fails the job rather than skipping quietly: this is the
# only workflow that publishes the site anywhere, so a skipped run would leave
# the nsite silently pinned to an older build.
#
# This site carries /.well-known/nostr.json, which is what resolves every
# `nostr://soapbox.pub/...` ngit remote in these repos. It lives in public/ and
# so is part of dist/ and of the manifest -- do not prune it. npanel answers it
# with `access-control-allow-origin: *`, which NIP-05 requires.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The build downloads its own Chrome below, so npm must not also try.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ahead of the build, so a config nsyte will not accept costs seconds
      # rather than failing at the end of a green-looking run.
      - name: Install nsyte and validate the config
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
        run: |
          set -eu
          : "${NSYTE_BUNKER:?NSYTE_BUNKER is not set; ask the ngit-ci operator to provision it for this repo alias.}"

          # Pin the binary. An unversioned install has been observed pulling
          # 0.10.1, which emits legacy kind-34128 events that every current
          # gateway ignores while still reporting a successful deploy.
          curl -sSL -o /usr/local/bin/nsyte \
            https://github.com/sandwichfarm/nsyte/releases/download/v0.27.2/nsyte-linux-0.27.2
          chmod +x /usr/local/bin/nsyte

          nsyte validate

      - run: npm ci

      # PRERENDER=1 renders every route in headless Chrome, so the runner needs
      # a browser and its shared libraries. GitLab got these from the
      # ghcr.io/puppeteer/puppeteer image; ngit-ci runs jobs in the operator's
      # own container and refuses workflow-declared ones, so install them here.
      # The renderer already passes --no-sandbox (see vite.config.ts), which is
      # what makes Chrome usable as root in a container.
      - name: Install Chrome for the prerenderer
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 fonts-liberation \
            >/dev/null
          # Package renamed in Ubuntu 24.04; accept either.
          sudo apt-get install -y --no-install-recommends libasound2t64 >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends libasound2 >/dev/null
          npx puppeteer browsers install chrome

      # Builds dist/, copies index.html -> 404.html and writes the search index.
      - run: npm run build

      - name: Publish to Blossom + relays
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
        run: |
          set -eu

          # Relays, servers and the site id all come from .nsite/config.json,
          # so they are versioned with the site rather than split across this
          # file. The secrets scan is skipped because it prompts on false
          # positives in our own content (blog posts about keys, nsec, and
          # bunker URLs), and a prompt is unanswerable here -- with -i it
          # defaults to N and aborts.
          set +e
          nsyte deploy dist \
            --sec "$NSYTE_BUNKER" \
            --concurrency 2 \
            --non-interactive \
            --skip-secrets-scan 2>&1 | tee /tmp/nsyte-deploy.log
          status="${PIPESTATUS[0]}"
          set -e

          # A deploy that changes no file exits NON-ZERO with "No new files to
          # upload". That is success: the manifest already on the relays
          # describes exactly this build.
          if [ "$status" -ne 0 ] && ! grep -q "No new files to upload" /tmp/nsyte-deploy.log; then
            exit "$status"
          fi
