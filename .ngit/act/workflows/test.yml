name: Test

# Typecheck / lint / unit tests / production build for the Soapbox marketing
# site. ngit-ci watches .ngit/act/workflows/ and runs each job with `act`
# (GitHub Actions-compatible syntax) in a Linux container. Runs on every push
# and on every Nostr PR.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # `npm run test` ends in `npm run build`, which is PRERENDER=1 and needs
      # a real headless Chrome. Same install as deploy-nsite.yml.
      - name: Install Chrome for the prerenderer
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 fonts-liberation \
            >/dev/null
          sudo apt-get install -y --no-install-recommends libasound2t64 >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends libasound2 >/dev/null
          npx puppeteer browsers install chrome

      # tsc + eslint + vitest + prerendered production build.
      - run: npm run test
