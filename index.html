<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; font-src 'self'; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: https: wss:; img-src 'self' data: blob: https:; media-src 'self' https:">
    <title>Soapbox</title>
    <meta name="description" content="Soapbox is customizable open-source software that puts the power of social media in the hands of the people.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Soapbox">
    <meta property="og:description" content="Soapbox is customizable open-source software that puts the power of social media in the hands of the people.">
    <meta property="og:image" content="">
    <meta property="og:url" content="">
    <meta property="og:site_name" content="Soapbox">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Soapbox">
    <meta name="twitter:description" content="Soapbox is customizable open-source software that puts the power of social media in the hands of the people.">
    <meta name="twitter:image" content="">
    
    <!-- Additional meta tags -->
    <meta name="image" content="">
    <meta name="author" content="Soapbox Technology">
    <meta name="keywords" content="soapbox, nostr, decentralized, social media, open source, ditto, fediverse, activitypub">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    
    <!-- Additional Open Graph tags -->
    <meta property="og:locale" content="en_US">
    <meta property="og:image:width" content="1300">
    <meta property="og:image:height" content="811">
    <meta property="og:image:type" content="image/png">
    
    <!-- Twitter specific -->
    <meta name="twitter:site" content="@soapbox_pub">
    <meta name="twitter:creator" content="@soapbox_pub">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="">
    
    <!-- Structured Data -->
    <script type="application/ld+json" id="structured-data">
    </script>
    
    <!-- Dynamic OG Meta Script -->
    <script>
      (function() {
        // Get the current origin (protocol + hostname + port)
        const baseUrl = window.location.origin;
        
        // Update OG image URLs
        const ogImage = baseUrl + '/assets/soapbox-og.png';
        document.querySelector('meta[property="og:image"]').setAttribute('content', ogImage);
        document.querySelector('meta[name="twitter:image"]').setAttribute('content', ogImage);
        document.querySelector('meta[name="image"]').setAttribute('content', ogImage);
        
        // Update OG URL
        document.querySelector('meta[property="og:url"]').setAttribute('content', baseUrl);
        
        // Update canonical URL
        document.querySelector('link[rel="canonical"]').setAttribute('href', baseUrl);
        
        // Update structured data
        const structuredData = {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Soapbox",
          "url": baseUrl,
          "logo": baseUrl + "/assets/logo.svg",
          "description": "Soapbox is customizable open-source software that puts the power of social media in the hands of the people.",
          "sameAs": [
            "https://gitlab.com/soapbox-pub"
          ],
          "foundingDate": "2020",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "url": baseUrl
          }
        };
        
        document.getElementById('structured-data').textContent = JSON.stringify(structuredData, null, 2);
      })();
    </script>
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#0482d8">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <meta name="msapplication-TileColor" content="#0482d8">
    <meta name="msapplication-config" content="/favicon/browserconfig.xml">
    <meta name="theme-color" content="#0482d8">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
