# The Docker image used to build your app
image: node:18

pages:
  before_script:
    - rm -rf public
    - npm install
  script:
    - npx vite build
    - cp dist/index.html dist/404.html
    - mv dist public
    # 👇 Copy all static assets from src to public
    - mkdir -p public/assets
    - cp -r src/assets/* public/assets/
    - echo "--- public/assets contents ---"
    - find public/assets
    - echo "--- index.html preview ---"
    - head -n 10 public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
