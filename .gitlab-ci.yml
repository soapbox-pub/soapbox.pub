# The Docker image used to build your app
image: node:18

pages:
  before_script:
    - rm -rf public
    - npm install
  script:
    - npx vite build
    - cp dist/index.html dist/404.html
    - mv dist public
    - mkdir -p public/assets
    - echo "--- copying image assets from src/assets/ ---"
    - apt-get update && apt-get install -y rsync
    - rsync -av --include='*/' --include='*.png' --include='*.jpg' --include='*.jpeg' --include='*.svg' --include='*.webp' --exclude='*' src/assets/ public/assets/
    - echo "--- asset tree ---"
    - find public/assets
    - echo "--- index.html preview ---"
    - head -n 10 public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
