# The Docker image used to build your app
image: node:18

pages:
  before_script:
    - rm -rf public
    - npm install
  script:
    - npx vite build
    - cp dist/index.html dist/404.html
    - mv dist public
    # ✅ Copy all image assets from anywhere in src/ to public/assets/
    - echo "--- copying all image files from anywhere in src/ ---"
    - |
      find src -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.webp' \) | while read file; do
        relpath=$(echo "$file" | sed 's|src/||')
        mkdir -p "public/assets/$(dirname "$relpath")"
        cp "$file" "public/assets/$relpath"
      done
    - echo "--- asset tree ---"
    - find public/assets
    - echo "--- index.html preview ---"
    - head -n 10 public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
