# The Docker image used to build your app
image: node:18

pages:
  before_script:
    - rm -rf public
    - npm install
  script:
    - npx vite build
    - cp dist/index.html dist/404.html
    - mv dist public
    - mkdir -p public/assets
    - echo "--- finding and copying image assets ---"
    - find src -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.webp' \) -exec cp --parents {} public/assets/ \;
    - echo "--- asset tree ---"
    - find public/assets
    - echo "--- index.html preview ---"
    - head -n 10 public/index.html
  artifacts:
    paths:
      - public
  rules:
    # Only run this job on the default branch (usually 'main')
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
