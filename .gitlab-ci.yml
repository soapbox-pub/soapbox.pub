# The Docker image used to build your app
image: node:18

pages:
  before_script:
    - npm install
  script:
    - npx vite build
    - cp dist/index.html dist/404.html
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    # Only run this job on the default branch (usually 'main')
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
