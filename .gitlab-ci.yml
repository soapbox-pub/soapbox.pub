image:
  name: ghcr.io/puppeteer/puppeteer:24
  docker:
    user: root

variables:
  PRERENDER: 1
  PUPPETEER_SKIP_DOWNLOAD: "true"

default:
  interruptible: true
  timeout: 2 minutes

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - npm run build
  only:
    variables:
      - $CI_DEFAULT_BRANCH != $CI_COMMIT_REF_NAME

pages:
  stage: deploy
  script:
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    variables:
      - $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
